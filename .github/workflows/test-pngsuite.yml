name: Pngsuite Test
run-name: ${{ github.actor }} running test for pngsuite
on: [pull_request]
jobs:
    build:
        name: Executing test script
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Compiling test binary
              run: gcc test/test.c bitreader.c decompress.c huffman_tree.c decoder.c -lm -o png_test_executable

            - name: Executing test binary
              run: ./png_test_executable test/pngsuite/png/basn6a08.png
